# yamllint disable rule:line-length
---
name: Update SHA256 Checksums

'on':
  workflow_dispatch:
    inputs:
      formula:
        description: 'Formula name to update (leave empty for all)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update-checksums:
    name: Update SHA256 Checksums
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        # yamllint disable-next-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "github-actions[bot]@users.noreply.github.com"

      - name: Update checksums
        id: update
        env:
          # Passed as an env var, never interpolated into the script body. A
          # `${{ ... }}` expansion is substituted into the shell source before
          # bash parses it, so a formula name containing shell metacharacters
          # would execute as code on a runner holding `contents: write`.
          FORMULA_INPUT: ${{ github.event.inputs.formula }}
        run: |
          set -e
          updated=""
          formula_input="$FORMULA_INPUT"

          # The formula name becomes a path under Formula/, so keep it a bare
          # name — no slashes, no leading dot, nothing that can walk out.
          if [ -n "$formula_input" ] && \
             [[ ! "$formula_input" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
            echo "::error::Invalid formula name: $formula_input"
            exit 1
          fi

          # Build candidate list
          if [ -n "$formula_input" ]; then
            candidates=("Formula/${formula_input}.rb")
          else
            shopt -s nullglob
            candidates=(Formula/*.rb)
          fi

          for formula in "${candidates[@]}"; do
            if [ -f "$formula" ]; then
              formula_name=$(basename "$formula" .rb)

              # Skip example formula
              if [ "$formula_name" = "example-tool" ]; then
                echo "Skipping example formula: $formula_name"
                continue
              fi

              echo "Updating checksums in $formula..."

              # Checksums only: the release tag lives in each url, so bumping a
              # formula to a new version is `brew bump-formula-pr` (auto-update.yml)
              # or the upstream repo's own release job, not this workflow.
              ruby - "$formula" <<'RUBY'
          require 'open3'
          require 'shellwords'

          path = ARGV[0]

          contents = File.read(path)

          # The sha256 need not sit immediately under its url: maniforge.rb puts a
          # "# SHA256 calculated from release binary" comment between them, and
          # demanding adjacency silently skipped that formula on every run.
          pattern = /(url "([^"]+)")\n((?:[ \t]*(?:#[^\n]*)?\n)*)([ \t]*sha256 ")([^"]*)"/

          contents = contents.gsub(pattern) do
            whole      = Regexp.last_match(0)
            url_stanza = Regexp.last_match(1)
            url        = Regexp.last_match(2)
            interlude  = Regexp.last_match(3)
            sha_prefix = Regexp.last_match(4)
            old_sha    = Regexp.last_match(5)

            cmd = "curl -sSL #{Shellwords.escape(url)} | shasum -a 256"
            puts "  Computing SHA256 for #{url}..."
            stdout, status = Open3.capture2('bash', '-lc', cmd)

            unless status.success?
              warn "  Failed to compute SHA for #{url}"
              next whole
            end

            new_sha = stdout.split.first
            if new_sha.nil? || new_sha.empty?
              warn "  Empty SHA for #{url}"
              next whole
            end

            if new_sha == old_sha
              puts "  SHA unchanged for #{url}"
              whole
            else
              puts "  Updated SHA: #{old_sha} -> #{new_sha}"
              "#{url_stanza}\n#{interlude}#{sha_prefix}#{new_sha}\""
            end
          end

          File.write(path, contents)
          RUBY

              if git diff --quiet "$formula"; then
                echo "No changes needed for $formula_name"
              else
                echo "Updated checksums for $formula_name"
                updated="${updated}${formula_name} "
              fi
            fi
          done

          echo "updated=$updated" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.update.outputs.updated != ''
        # yamllint disable-next-line rule:line-length
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1  # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update SHA256 checksums"
          title: "chore: Update SHA256 checksums"
          body: |
            ## SHA256 Checksum Updates

            This PR updates SHA256 checksums for formulas.

            **Updated formulas**: ${{ steps.update.outputs.updated }}

            ### Checklist
            - [x] SHA256 checksums updated
            - [ ] Manual review required
            - [ ] Tests pass

            Please review and merge if tests pass.
          branch: update-checksums
          delete-branch: true
          labels: |
            automated
            checksums

      - name: Summary
        run: |
          echo "Checksum update completed"
          echo "Updated formulas: ${{ steps.update.outputs.updated }}"
