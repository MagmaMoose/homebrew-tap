# yamllint disable rule:line-length
---
name: CI

'on':
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  audit:
    name: Audit
    runs-on: macos-latest

    steps:
      - name: Checkout
        # yamllint disable-next-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Homebrew
        # yamllint disable-next-line rule:line-length
        uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1

      - name: Tap repository
        run: |
          brew_repo="$(brew --repository)"
          mkdir -p "$brew_repo/Library/Taps/magmamoose"
          ln -s "$GITHUB_WORKSPACE" \
            "$brew_repo/Library/Taps/magmamoose/homebrew-tap"

      - name: Audit formulas
        run: |
          for formula in Formula/*.rb; do
            [ -f "$formula" ] || continue
            formula_name=$(basename "$formula" .rb)

            # Skip example formula
            if [ "$formula_name" = "example-tool" ]; then
              echo "Skipping example formula: $formula_name"
              continue
            fi

            echo "::group::Auditing $formula_name"
            brew audit --strict --online "magmamoose/tap/$formula_name" || exit 1
            echo "::endgroup::"
          done

  style:
    name: Style Check
    runs-on: macos-latest

    steps:
      - name: Checkout
        # yamllint disable-next-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Homebrew
        # yamllint disable-next-line rule:line-length
        uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1

      - name: Check formula style
        run: |
          for formula in Formula/*.rb; do
            [ -f "$formula" ] || continue
            echo "::group::Style check $(basename "$formula")"
            brew style "$formula" || exit 1
            echo "::endgroup::"
          done

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # yamllint disable-next-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Lint Markdown files
        # yamllint disable-next-line rule:line-length
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'
          config: '.markdownlint.json'
        continue-on-error: true

  test:
    name: Test Formulas
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-14, macos-15]
      fail-fast: false

    steps:
      - name: Checkout
        # yamllint disable-next-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Homebrew
        # yamllint disable-next-line rule:line-length
        uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1

      - name: Tap repository
        run: |
          brew_repo="$(brew --repository)"
          mkdir -p "$brew_repo/Library/Taps/magmamoose"
          ln -s "$GITHUB_WORKSPACE" \
            "$brew_repo/Library/Taps/magmamoose/homebrew-tap"

      - name: Install and test formulas
        run: |
          set -e
          runner_macos="$(sw_vers -productVersion | cut -d. -f1)"
          for formula in Formula/*.rb; do
            if [ -f "$formula" ]; then
              formula_name=$(basename "$formula" .rb)

              # Skip example formula
              if [ "$formula_name" = "example-tool" ]; then
                echo "Skipping example formula: $formula_name"
                continue
              fi

              # brew refuses to install a formula on a macOS older than its
              # `depends_on macos:` minimum, so there is nothing to test here.
              min_macos="$(brew info --json=v2 "magmamoose/tap/$formula_name" | jq -r \
                '[.formulae[0].requirements[] | select(.name == "macos" and .version != null) | .version] | first // empty')"
              if [ -n "$min_macos" ] && [[ "$min_macos" =~ ^[0-9] ]] && [ "$runner_macos" -lt "${min_macos%%.*}" ]; then
                echo "::notice::Skipping $formula_name: it needs macOS $min_macos or newer, this runner has macOS $runner_macos"
                continue
              fi

              echo "Testing $formula_name..."

              # Install formula from this tap explicitly as a formula (not cask)
              brew install --build-from-source "magmamoose/tap/$formula_name" || {
                echo "Failed to install $formula_name"
                exit 1
              }

              # Run formula tests
              brew test "magmamoose/tap/$formula_name" || {
                echo "Tests failed for $formula_name"
                exit 1
              }

              # Uninstall to clean up
              brew uninstall --force "magmamoose/tap/$formula_name"
            fi
          done

      - name: Summary
        if: always()
        run: |
          echo "Formula testing completed"
          brew --version
